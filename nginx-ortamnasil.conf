# /etc/nginx/sites-available/ortamnasil
# Cloudflare Origin + mevcut nginx'e eklenen server bloğu
# ln -s /etc/nginx/sites-available/ortamnasil /etc/nginx/sites-enabled/

server {
    listen 443 ssl;
    server_name www.ortamnasil.com ortamnasil.com;

    # Cloudflare Origin Certificate (15 yıl geçerli, ücretsiz)
    ssl_certificate /etc/ssl/ortamnasil/origin.pem;
    ssl_certificate_key /etc/ssl/ortamnasil/origin-key.pem;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name www.ortamnasil.com ortamnasil.com;
    return 301 https://$host$request_uri;
}
