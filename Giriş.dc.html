<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#fafcfb; font-family:'Space Grotesk',sans-serif; }
a { color:#0d7a6f; text-decoration:none; } a:hover { color:#0a5c54; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
@keyframes pop { 0%{transform:scale(.6); opacity:0} 70%{transform:scale(1.06)} 100%{transform:scale(1); opacity:1} }
</style>
</helmet>
<div style="min-height:100vh; background:#fafcfb; display:flex; flex-direction:column;" data-screen-label="Giriş / Takma Ad">
<header style="display:flex; align-items:center; justify-content:center; padding:24px;">
  <a href="OrtamNasıl - Ana Sayfa.dc.html" style="display:flex; align-items:center; gap:10px;">
    <div style="display:flex; gap:4px;">
      <span style="width:10px; height:10px; border-radius:50%; background:#e05d4b;"></span>
      <span style="width:10px; height:10px; border-radius:50%; background:#e8b93c;"></span>
      <span style="width:10px; height:10px; border-radius:50%; background:#2eb586; animation:blink 2s infinite;"></span>
    </div>
    <span style="font-weight:700; font-size:20px; color:#12312c;">OrtamNasıl?</span>
  </a>
</header>

<div style="flex:1; display:flex; align-items:center; justify-content:center; padding:24px 32px 64px;">
  <div style="width:520px;">
    <div style="text-align:center; margin-bottom:28px;">
      <div style="font-size:44px; margin-bottom:12px;">🥸</div>
      <h1 style="margin:0 0 10px; font-size:32px; color:#12312c; letter-spacing:-.5px;">Kim olmak istersin?</h1>
      <p style="margin:0; font-size:15.5px; color:#5a6a66; line-height:1.55;">Gerçek ismini isteMİyoruz. Buradaki kimliğin, seçeceğin takma ad. İyi seç — itirafların bu isimle anılacak.</p>
    </div>

    <div style="background:#fff; border:1px solid #e3ebe8; border-radius:18px; padding:32px 36px; display:grid; gap:20px;">
      <div>
        <label style="display:block; font-size:14px; font-weight:600; color:#12312c; margin-bottom:8px;">Takma adın</label>
        <div style="display:flex; gap:10px;">
          <input value="{{ nick }}" onChange="{{ onNick }}" placeholder="örn. SinirliPenguen42" style="flex:1; box-sizing:border-box; font-family:'IBM Plex Mono',monospace; font-size:15px; padding:14px 16px; border:1.5px solid {{ borderColor }}; border-radius:10px; background:#fff; color:#12312c; outline:none;">
          <button onClick="{{ roll }}" title="Rastgele öner" style="font-family:'Space Grotesk',sans-serif; font-size:18px; padding:0 16px; background:#eef5f2; border:1.5px solid #cfdcd8; border-radius:10px; cursor:pointer;" style-hover="background:#e3f0ea;">🎲</button>
        </div>
        <div style="margin-top:8px; font-size:13px; color:{{ statusColor }}; min-height:18px;">{{ statusMsg }}</div>
      </div>
      <div>
        <label style="display:block; font-size:14px; font-weight:600; color:#12312c; margin-bottom:8px;">E-posta <span style="color:#7a8a86; font-weight:400;">(sadece giriş için, tek yönlü şifrelenir)</span></label>
        <input placeholder="sen@ornek.com" style="width:100%; box-sizing:border-box; font-family:'Space Grotesk',sans-serif; font-size:15px; padding:14px 16px; border:1.5px solid #cfdcd8; border-radius:10px; background:#fff; color:#12312c; outline:none;">
      </div>
      <button style="font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; padding:15px; background:#0d7a6f; color:#fff; border:none; border-radius:12px; cursor:pointer;" style-hover="background:#0a5c54;">Bu kimlikle devam et</button>
      <p style="margin:0; text-align:center; font-size:12.5px; color:#9aa8a4; line-height:1.5;">🔒 Takma adın e-postanla eşleştirilemez şekilde saklanır.<br>Zaten hesabın var mı? <a href="#" style="font-weight:600;">Giriş yap</a></p>
    </div>

    <div style="margin-top:20px; text-align:center;">
      <div style="font-size:12.5px; color:#9aa8a4; margin-bottom:10px;">İlham lazımsa, boşta olanlardan:</div>
      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
        <sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="4">
          <span onClick="{{ s.pick }}" style="font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#0d7a6f; background:#fff; border:1px solid #cfdcd8; padding:6px 14px; border-radius:999px; cursor:pointer;" style-hover="background:#e8f3f0;">{{ s.name }}</span>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { nick: "" };
  pool = ["KızgınKanguru7", "MelankolikMartı", "SabırlıAhtapot", "KaçakÇaycı", "GizliVizyoner", "YorgunUnicorn", "PasifAgresifPanda", "MesaideKayıp"];
  taken = ["sinirlipenguen42", "kaçanbalık", "uykusuzkirpi"];
  renderVals() {
    const nick = this.state.nick;
    const clean = nick.trim().toLocaleLowerCase("tr");
    let statusMsg = "", statusColor = "#7a8a86", borderColor = "#cfdcd8";
    if (clean.length > 0 && clean.length < 3) { statusMsg = "Biraz daha uzun olsun — en az 3 karakter."; statusColor = "#96690f"; borderColor = "#e8b93c"; }
    else if (this.taken.includes(clean)) { statusMsg = "❌ Bu isim kapılmış. " + nick.trim() + "43 dene?"; statusColor = "#b23a28"; borderColor = "#e05d4b"; }
    else if (clean.length >= 3) { statusMsg = "✓ Müsait! Bu isimle efsane olabilirsin."; statusColor = "#177a52"; borderColor = "#2eb586"; }
    return {
      nick, statusMsg, statusColor, borderColor,
      onNick: (e) => this.setState({ nick: e.target.value }),
      roll: () => this.setState({ nick: this.pool[Math.floor(Math.random() * this.pool.length)] }),
      suggestions: this.pool.slice(0, 4).map(name => ({ name, pick: () => this.setState({ nick: name }) })),
    };
  }
}
</script>
</body>
</html>
