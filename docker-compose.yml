services:
  app:
    build:
      context: ./web
      dockerfile: Dockerfile
      secrets:
        - env
      # Sitemap gibi sayfalar derleme sirasinda veritabanina sorgu atiyor.
      # extra_hosts yalnizca calisma anindaki konteynere uygulaniyor; derleme
      # asamasinda da ayni esleme gerekiyor, yoksa "Can't reach database
      # server at host.docker.internal" ile kiriliyor.
      extra_hosts:
        - "host.docker.internal:host-gateway"
    container_name: ortamnasil
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"
    env_file:
      - ./web/.env
    environment:
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"

secrets:
  env:
    file: ./web/.env
